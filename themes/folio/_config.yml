# Experience Section
experience:
  intro_variants:
    - "It all began at 14 when I stumbled onto a \"signatures\" design board on a parkour forum—thanks to a friend. I couldn't sleep after discovering Photoshop filters and dove headfirst into experimenting. From web design and 3D matte painting to animation and interaction design, one skill led to another. I built a solid portfolio, landed clients, and helped shape multiple products from the ground up."
  timeline:
    - title: "Freelance"
      milestone: "Freelance"
      content: "I've always cherished the freedom of freelancing—the variety of projects, the chance to influence outcomes, and the thrill of each new challenge. Early in my career, I loved bringing clients' dream products to life, having fun every step of the way. Nothing beats the rush of creative control."
    - title: "Studio Co-founder"
      milestone: "Studio Co-founder"
      content: "While working at startup 66Audio, a few coworkers and I launched our own design studio, Maise. We expanded my client list and tackled bigger visions together. We thrived in fintech and crypto, guiding startups from discovery to launch. It was one of the best times of my life—lifelong friendships formed that I hope endure."
    - title: "♾️ And Beyond"
      milestone: "Now"
      content: "I thrive on exploring cutting-edge tools—design, motion, 3D, WebGL, AI—you name it. I'm usually ahead of the curve, spending free time testing betas and giving feedback to devs on Twitter/X to help refine features. Beyond the nerdy workaholism, I'm hooked on handheld consoles and cherish lazy couch gaming sessions whenever possible."

